services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    image: ${ACR_REGISTRY:-paperbeepoc.azurecr.io}/${IMAGE_NAME:-paperbee}:${IMAGE_TAG:-develop}
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - ENVIRONMENT=prod
      - OPEN_API_KEY=${OPEN_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAX_CONCURRENT_BATCHES=2
      - PERFORMANCE_MODE=False
    command: python run_fastapi.py
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis

  mcq_worker:
    image: ${ACR_REGISTRY:-paperbeepoc.azurecr.io}/${IMAGE_NAME:-paperbee}:${IMAGE_TAG:-develop}
    restart: unless-stopped
    environment:
      - ENVIRONMENT=prod
      - OPEN_API_KEY=${OPEN_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAX_CONCURRENT_BATCHES=2
      - PERFORMANCE_MODE=False
    command: celery -A apps.papers.tasks worker -Q mcq_queue --loglevel=info --concurrency=2 --max-memory-per-child=300000 --prefetch-multiplier=1
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    depends_on:
      - redis

  image_worker:
    image: ${ACR_REGISTRY:-paperbeepoc.azurecr.io}/${IMAGE_NAME:-paperbee}:${IMAGE_TAG:-develop}
    restart: unless-stopped
    environment:
      - ENVIRONMENT=prod
      - OPEN_API_KEY=${OPEN_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAX_CONCURRENT_BATCHES=2
      - PERFORMANCE_MODE=False
    command: celery -A apps.papers.tasks worker -Q image_queue --loglevel=info --concurrency=1 --max-memory-per-child=600000 --prefetch-multiplier=1
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 256M
    depends_on:
      - redis

  answer_worker:
    image: ${ACR_REGISTRY:-paperbeepoc.azurecr.io}/${IMAGE_NAME:-paperbee}:${IMAGE_TAG:-develop}
    restart: unless-stopped
    environment:
      - ENVIRONMENT=prod
      - OPEN_API_KEY=${OPEN_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAX_CONCURRENT_BATCHES=2
      - PERFORMANCE_MODE=False
    command: celery -A apps.papers.tasks worker -Q answer_queue --loglevel=info --concurrency=2 --max-memory-per-child=400000 --prefetch-multiplier=1
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    depends_on:
      - redis
